# Local-only TLS edge for docker-compose.ipad.yml. It intentionally has no
# HTTP listener: the iPad must use the trusted HTTPS origin required by Safari
# for camera and precise geolocation APIs.

server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Do not teach test devices HSTS for a private address whose certificate is
    # deliberately short-lived. The upstream web image sets HSTS for real TLS
    # deployments, so suppress it at this local development edge.
    proxy_hide_header Strict-Transport-Security;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Preserve the public HTTPS origin while proxying through the HTTP-only web
    # container. Browser traffic remains same-origin; the web container proxies
    # /api and /socket.io to their internal Compose service.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;

    location /socket.io/ {
        proxy_pass http://web:8080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Declaring any proxy_set_header at location level disables inheritance
        # of all server-level proxy_set_header directives, so repeat them here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # Pairing credentials, rotating challenges, and scan responses are never
    # cached or buffered at the LAN edge.
    location ^~ /api/terminals {
        proxy_pass http://web:8080;
        proxy_buffering off;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        expires off;
        proxy_read_timeout 60s;
    }

    # A hard refresh of the kiosk never reuses a cached React shell. The PWA's
    # service worker also treats this navigation as NetworkOnly.
    location = /kiosk {
        # The optional pairing code may arrive in the query string. Never put
        # that one-time credential into access logs at the LAN edge.
        access_log off;
        proxy_pass http://web:8080;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
        # Pairing may arrive as a query credential; never forward that URL as
        # Referer while the kiosk shell loads its scripts and manifest.
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        expires off;
    }

    location / {
        proxy_pass http://web:8080;
    }
}
