name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openclockwork
          POSTGRES_PASSWORD: openclockwork
          POSTGRES_DB: openclockwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openclockwork -d openclockwork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openclockwork:openclockwork@localhost:5432/openclockwork_test?schema=public
      E2E_ADMIN_DATABASE_URL: postgresql://openclockwork:openclockwork@localhost:5432/postgres
      E2E_DATABASE_URL: postgresql://openclockwork:openclockwork@localhost:5432/openclockwork_test?schema=public
      JWT_SECRET: release-jwt-secret-do-not-use-in-prod
      ERP_API_KEY: release-erp-key
      TZ: Europe/Berlin
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Verify tag, package version, and curated notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node ops/verify-release-version.mjs

      - name: Export image version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Test release tooling and database target safety
        run: pnpm nx run api-e2e:test-ops

      - name: Lint workspace
        run: pnpm nx run-many -t lint

      - name: Typecheck workspace
        run: pnpm nx run-many -t typecheck

      - name: Test workspace
        run: pnpm nx run-many -t test --configuration=ci

      - name: Build workspace
        run: pnpm nx run-many -t build

      - name: Apply release migrations to a fresh database
        run: pnpm prisma migrate deploy

      - name: Run API end-to-end tests
        run: pnpm nx e2e api-e2e

  publish-images:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
          - image: web
            dockerfile: Dockerfile.web

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openclockwork-${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.verify-release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=OpenClockwork ${{ matrix.image }}
            org.opencontainers.image.description=OpenClockwork ${{ matrix.image }} release image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish-release:
    needs:
      - verify-release
      - publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Publish GitHub Release with curated and generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_notes=$(node ops/release-notes.mjs)
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --fail-on-no-commits \
            --latest \
            --title "OpenClockwork $RELEASE_TAG" \
            --notes "$release_notes" \
            --generate-notes
