# HTTPS/LAN overlay for testing OpenClockwork from an iPad or employee phone.
# Combine this file with docker-compose.dev.yml; do not run it by itself.
#
# Setup: docs/IPAD_TERMINAL_SETUP.de.md
# Start:
#   docker compose -f docker-compose.dev.yml -f docker-compose.ipad.yml \
#     --env-file .env.ipad up -d --build

services:
  api:
    environment:
      # Geolocation and camera calls originate from the HTTPS LAN URL. Requiring
      # the exact origin prevents an accidentally broad CORS configuration.
      API_CORS_ORIGINS: ${IPAD_ORIGIN:?Set IPAD_ORIGIN in .env.ipad},http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}

  ipad-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '${IPAD_HTTPS_BIND_ADDRESS:-0.0.0.0}:${IPAD_HTTPS_PORT:-8443}:8443'
    volumes:
      - type: bind
        source: ${IPAD_TLS_CERT_FILE:-./.certs/ipad/openclockwork-ipad.pem}
        target: /etc/nginx/tls/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IPAD_TLS_KEY_FILE:-./.certs/ipad/openclockwork-ipad-key.pem}
        target: /etc/nginx/tls/tls.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ops/nginx-ipad.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://127.0.0.1:8443/api/health >/dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
